<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receba a Benção</title>
    <link rel="stylesheet" href="style.css">
</head>

<body id="body">

    <!-- CONTEÚDO -->
    <div class="conteudo">

        <h1> Mesmo nos dias silenciosos, ainda existe esperança.</h1>
        <p> Clique abaixo para receber uma mensagem especial.</p>
        <button onclick="receberBencao()"> Receba a Benção!</button>
    </div>


    <!-- POPUP -->
    <div class="popup" id="popup">

        <div class="popup-box">
            <h2>✨ Sua mensagem ✨</h2>
            <p id="mensagem"> Você é mais forte do que imagina. </p>
        </div>
    </div>
    <script src="script.js"></script>

</body>
</html>
